<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
        <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Success Message */
.message {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    display: none; /* Hidden by default */
}

.message.success {
    display: block;
    background-color: #d4edda;
    color: #155724;
    border: 1px solid #28a745;
}

.message.error {
    display: block;
    background-color: #f8d7da;
    color: #721c24;
    border: 1px solid #dc3545;
}
    </style>
   
</head>

<body>

   <nav>

    <a href="home.html">Home</a>

    <a href="search.html">Explore</a>

    <a href="login.html" id="loginLink">Login</a>

    <a href="cart.html" id="cartLink" style="display:none;">
        Cart (<span id="cartCount">0</span>)
    </a>

    <a href="contact.html">Contact Us</a>

    <a href="#" id="logoutLink" style="display:none;">
        Logout
    </a>

</nav>

    <div class="login-container">

        <div class="login-box">

            <h1>Create Account</h1>

            <p class="subtitle">
                Fill in the details below
            </p>

            <form id="signupForm">

                <div class="input-group">
                    <label>Full Name</label>
                    <input
                        type="text"id="fullname" placeholder="Enter your full name"required>
                </div>
                <div class="input-group">
    <label>Address</label>
<input type="text" id="address" placeholder="Enter your address" required>
</div>

                <div class="input-group">
                    <label>Email</label>
                    <input
                        type="email"id="email" placeholder="Enter your email"required autocomplete="off">
                </div>

                <div class="input-group">
                    <label>Contact Number</label>
                    <input
                        type="text" id="phone" placeholder="98XXXXXXXX"required>
                </div>

                <div class="input-group">
                    <label>Username</label>
                    <input
                        type="text" id="username" placeholder="Choose a username" required autocomplete="off">
                </div>

                <div class="input-group">

                    <label>Password</label>

                    <div class="password-box">

                        <input
                            type="password" id="password" placeholder="Create password" required>

                        <i class="fa-solid fa-eye eye-icon"
                            id="togglePassword"></i>

                    </div>

                </div>

                <div class="input-group">

                    <label>Confirm Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            required>

                        <i class="fa-solid fa-eye eye-icon"
                            id="toggleConfirmPassword"></i>

                    </div>

                </div>

                <p class="message" id="message"></p>

                <button
                    type="submit"
                    class="login-btn">

                    Create Account

                </button>

            </form>

            <div class="signup-link">

                Already have an account?

                <a href="login.html">

                    Login

                </a>

            </div>

        </div>

    </div>

    <script src="signup.js"></script>

</body>

</html>
