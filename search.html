<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medicine Search</title>

<link rel="stylesheet" href="style.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#eaf6ff,#d8f3ff,#ffffff);
    min-height:100vh;
}

/* Navigation */

nav{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:20px;
    padding:20px 50px;
    background:linear-gradient(90deg,#1E3A8A,#2563EB);
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    position:sticky;
    top:0;
    z-index:100;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:20px;
    font-weight:bold;
    padding:10px 18px;
    border-radius:30px;
    transition:.3s;
}

nav a:hover{
    background:white;
    color:#2563EB;
    transform:translateY(-3px);
}

h1{
    text-align:center;
    font-size:55px;
    margin-top:60px;
    color:#1E3A8A;
}

.search{
    display:flex;
    justify-content:center;
    margin:40px 0;
}

#input{
    width:700px;
    height:65px;
    padding:0 25px;
    font-size:20px;
    border:none;
    outline:none;
    border-radius:40px;
    background:white;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

#result{
    width:700px;
    margin:auto;
    border-radius:15px;
    overflow:hidden;
}

.item{
    padding:18px;
    background:white;
    border-bottom:1px solid #ddd;
    cursor:pointer;
    transition:.3s;
    font-size:18px;
}

.item:hover{
    background:#DBEAFE;
    padding-left:30px;
}

#details{
    width:750px;
    margin:40px auto;
    padding:30px;
    border-radius:20px;
    background:white;
    box-shadow:0 15px 35px rgba(0,0,0,.15);
    display:none;
}

.medi-img{
    width:350px;
    height:220px;
    object-fit:cover;
    display:block;
    margin:0 auto 25px;
    border-radius:15px;
}

.btn-group{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:25px;
}

.btn{
    padding:12px 35px;
    background:#2563EB;
    color:white;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-size:18px;
    transition:.3s;
}

.btn:hover{
    background:#1E3A8A;
}

#toast{
    position:fixed;
    top:25px;
    right:25px;
    background:#16a34a;
    color:white;
    padding:15px 25px;
    border-radius:10px;
    opacity:0;
    visibility:hidden;
    transition:.4s;
}

#toast.show{
    opacity:1;
    visibility:visible;
}

@media(max-width:768px){

nav{
justify-content:center;
flex-wrap:wrap;
padding:20px;
}

h1{
font-size:38px;
}

#input,
#result,
#details{
width:90%;
}

.medi-img{
width:100%;
height:200px;
}

}

</style>

</head>

<body>

<nav>

<a href="home.html">Home</a>

<a href="search.html">Explore</a>

<a href="login.html" id="loginLink">Login</a>

<a href="cart.html" id="cartLink" style="display:none;">
🛒 Cart (<span id="cartCount">0</span>)
</a>

<a href="contact.html">Contact Us</a>

<a href="#" id="logoutLink" style="display:none;">Logout</a>

</nav>

<h1>Search Here</h1>

<div class="search">

<input
type="text"
id="input"
placeholder="Medicine name..."
onkeyup="medsearch()">

</div>

<div id="result"></div>

<div id="details"></div>

<div id="toast">
Successfully added to cart.
</div>

<script>

const medicines = [
{
    name:"Paracetamol",
    description:"Paracetamol is an analgesic agent used to treat fever and mild to moderate pain. It reduces pain and fever.",
    image:"paracetamol.png",
    price:25,
    expiry:"12/2027",
    manufacturer:"ABC Pharma",
    dosage:"500 mg",
    stock:"Available",
    uses:"Used for fever and pain relief.",
    sideEffects:"Nausea, dizziness"
},

{
    name:"Ibuprofen",
    description:"Ibuprofen is a nonsteroidal anti-inflammatory drug used to relieve pain, fever and inflammation.",
    image:"iburo.png",
    price:40,
    expiry:"10/2028",
    manufacturer:"XYZ Pharma",
    dosage:"400 mg",
    stock:"Available",
    uses:"Reduces pain and inflammation.",
    sideEffects:"Stomach upset"
},

{
    name:"Amoxicillin",
    description:"Amoxicillin is used to treat bacterial infections.",
    image:"amo.png",
    price:60,
    expiry:"08/2028",
    manufacturer:"ABC Pharma",
    dosage:"250 mg",
    stock:"Available",
    uses:"Treats bacterial infections.",
    sideEffects:"Diarrhea, nausea"
},

{
    name:"Cetirizine",
    description:"Cetirizine is an antihistamine used to treat allergies.",
    image:"ctz.png",
    price:35,
    expiry:"03/2028",
    manufacturer:"Cipla",
    dosage:"10 mg",
    stock:"Available",
    uses:"Relieves allergy symptoms.",
    sideEffects:"Sleepiness"
},

{
    name:"Aspirin",
    description:"Aspirin helps reduce pain, fever and inflammation.",
    image:"asp.png",
    price:30,
    expiry:"11/2027",
    manufacturer:"Bayer",
    dosage:"75 mg",
    stock:"Available",
    uses:"Pain relief and blood thinner.",
    sideEffects:"Stomach irritation"
},

{
    name:"Omeprazole",
    description:"Omeprazole reduces stomach acid and treats ulcers.",
    image:"ome.png",
    price:90,
    expiry:"05/2029",
    manufacturer:"Sun Pharma",
    dosage:"20 mg",
    stock:"Available",
    uses:"Treats acidity.",
    sideEffects:"Headache"
},

{
    name:"Metformin",
    description:"Metformin helps control blood sugar levels.",
    image:"met.png",
    price:80,
    expiry:"02/2029",
    manufacturer:"Novartis",
    dosage:"500 mg",
    stock:"Available",
    uses:"Controls diabetes.",
    sideEffects:"Nausea"
}

];

function medsearch(){

let input=document.getElementById("input").value.toLowerCase();

let result=document.getElementById("result");

let details=document.getElementById("details");

if(input===""){

result.innerHTML="";
details.style.display="none";
return;

}

let output="";

medicines.forEach(function(medicine){

if(medicine.name.toLowerCase().includes(input)){

output+=`
<div class="item" onclick="selectMedicine('${medicine.name}')">
${medicine.name}
</div>
`;

}

});

result.innerHTML=output;

}

function selectMedicine(name){

let medicine=medicines.find(function(item){

return item.name===name;

});

document.getElementById("result").innerHTML="";

let details=document.getElementById("details");

details.style.display="block";

details.innerHTML=`

<h2>${medicine.name}</h2>

<img src="${medicine.image}" class="medi-img">

<p><b>Description:</b> ${medicine.description}</p>

<p><b>Price:</b> Rs.${medicine.price}</p>

<p><b>Expiry:</b> ${medicine.expiry}</p>

<p><b>Manufacturer:</b> ${medicine.manufacturer}</p>

<p><b>Dosage:</b> ${medicine.dosage}</p>

<p><b>Stock:</b> ${medicine.stock}</p>

<p><b>Uses:</b> ${medicine.uses}</p>

<p><b>Side Effects:</b> ${medicine.sideEffects}</p>

<div class="btn-group">

<button class="btn" onclick="orderNow()">
Order Now
</button>

<button class="btn" onclick="addToCart('${medicine.name}',${medicine.price})">
Add To Cart
</button>

</div>

`;

}
function orderNow(){

const currentUser=JSON.parse(localStorage.getItem("currentUser"));

if(!currentUser){

alert("Please login first.");

window.location.href="login.html";

return;

}

window.location.href="cart.html";

}

function addToCart(name,price){

const currentUser=JSON.parse(localStorage.getItem("currentUser"));

if(!currentUser){

alert("Please login first.");

window.location.href="login.html";

return;

}

let cart=JSON.parse(localStorage.getItem("cart")) || [];

let item=cart.find(function(product){

return product.name===name;

});

if(item){

item.quantity++;

}else{

cart.push({

name:name,
price:price,
quantity:1

});

}

localStorage.setItem("cart",JSON.stringify(cart));

updateCartCount();

showToast();

}

function updateCartCount(){

let cart=JSON.parse(localStorage.getItem("cart")) || [];

let total=0;

cart.forEach(function(item){

total+=item.quantity;

});

document.getElementById("cartCount").innerHTML=total;

}

function showToast(){

let toast=document.getElementById("toast");

toast.classList.add("show");

setTimeout(function(){

toast.classList.remove("show");

},2000);

}

const currentUser=JSON.parse(localStorage.getItem("currentUser"));

if(currentUser){

document.getElementById("loginLink").style.display="none";

document.getElementById("cartLink").style.display="inline-block";

document.getElementById("logoutLink").style.display="inline-block";

updateCartCount();

}else{

document.getElementById("loginLink").style.display="inline-block";

document.getElementById("cartLink").style.display="none";

document.getElementById("logoutLink").style.display="none";

}

document.getElementById("logoutLink").addEventListener("click",function(e){

e.preventDefault();

localStorage.removeItem("currentUser");

alert("Logged out successfully.");

window.location.href="login.html";

});

</script>

</body>
</html>
