<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>

        /* Success Popup */

        .modal{
            display:none;
            position:fixed;
            left:0;
            top:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.5);
            justify-content:center;
            align-items:center;
            z-index:9999;
        }

        .modal-content{
            background:white;
            width:350px;
            padding:25px;
            border-radius:12px;
            text-align:center;
            box-shadow:0 5px 15px rgba(0,0,0,0.3);
        }

        .modal-content h2{
            color:#28a745;
            margin-bottom:10px;
        }

        .modal-content p{
            margin-bottom:20px;
        }

        .confirm-btn{
            background:#28a745;
            color:white;
            border:none;
            padding:10px 25px;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        .confirm-btn:hover{
            background:#218838;
        }

    </style>

</head>

<body>

    <nav>

        <a href="home.html">Home</a>
        <a href="search.html">Explore</a>
        <a href="login.html">Login</a>
        <a href="contact.html">Contact Us</a>

    </nav>

    <div class="login-container">

        <div class="login-box">

            <h1>Forgot Password</h1>

            <p class="subtitle">
                Create a new password
            </p>

            <form id="forgotForm">

                <div class="input-group">

                    <label>Username</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        required>

                </div>

                <div class="input-group">

                    <label>New Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Enter new password"
                            required>

                        <i class="fa-solid fa-eye eye-icon"
                        id="toggleNewPassword"></i>

                    </div>

                </div>

                <div class="input-group">

                    <label>Confirm Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            required>

                        <i class="fa-solid fa-eye eye-icon"
                        id="toggleConfirmPassword"></i>

                    </div>

                </div>

                <p class="message" id="message"></p>

                <button
                    type="submit"
                    class="login-btn">

                    Reset Password

                </button>

            </form>

            <div class="signup-link">

                <a href="login.html">

                    Back to Login

                </a>

            </div>

        </div>

    </div>

    <!-- Success Popup -->

    <div id="successModal" class="modal">

        <div class="modal-content">

            <h2>Password Changed Successfully!</h2>

            <p>Your password has been updated.</p>

            <button id="okBtn" class="confirm-btn">

                OK

            </button>

        </div>

    </div>

    <script>

        // Show / Hide New Password

        const toggleNewPassword = document.getElementById("toggleNewPassword");
        const newPassword = document.getElementById("newPassword");

        toggleNewPassword.onclick = function(){

            if(newPassword.type === "password"){

                newPassword.type = "text";
                this.classList.replace("fa-eye","fa-eye-slash");

            }else{

                newPassword.type = "password";
                this.classList.replace("fa-eye-slash","fa-eye");

            }

        };

        // Show / Hide Confirm Password

        const toggleConfirmPassword = document.getElementById("toggleConfirmPassword");
        const confirmPassword = document.getElementById("confirmPassword");

        toggleConfirmPassword.onclick = function(){

            if(confirmPassword.type === "password"){

                confirmPassword.type = "text";
                this.classList.replace("fa-eye","fa-eye-slash");

            }else{

                confirmPassword.type = "password";
                this.classList.replace("fa-eye-slash","fa-eye");

            }

        };

        // Reset Password

        document.getElementById("forgotForm").addEventListener("submit", function(e){

            e.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("newPassword").value;
            const confirm = document.getElementById("confirmPassword").value;
            const message = document.getElementById("message");

            message.innerHTML = "";
            message.style.color = "red";

            if(password !== confirm){

                message.innerHTML = "Passwords do not match.";
                return;

            }

            let users = JSON.parse(localStorage.getItem("users")) || [];

            const user = users.find(u => u.username === username);

            if(!user){

                message.innerHTML = "Username not found.";
                return;

            }

            user.password = password;

            localStorage.setItem("users", JSON.stringify(users));

            document.getElementById("successModal").style.display = "flex";

        });

        // OK Button

        document.getElementById("okBtn").onclick = function(){

            document.getElementById("successModal").style.display = "none";

            window.location.href = "login.html";

        };

    </script>

</body>

</html>
