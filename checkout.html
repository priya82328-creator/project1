<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pharmacy Invoice</title>

<link rel="stylesheet" href="style.css">

<style>

body{
margin:0;
padding:40px;
background:#f4f8ff;
font-family:Arial,sans-serif;
}

.back-btn{
position:fixed;
top:25px;
left:25px;
background:#1E3A8A;
color:white;
text-decoration:none;
padding:12px 22px;
border-radius:8px;
font-size:16px;
font-weight:bold;
transition:.3s;
}

.back-btn:hover{
background:#2563eb;
}

.checkout-container{
max-width:650px;
margin:40px auto;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#1E3A8A;
margin-bottom:30px;
}

.checkout-container h2{
color:#1E3A8A;
border-bottom:2px solid #ddd;
padding-bottom:10px;
margin-top:25px;
}

.customer-details p{
font-size:17px;
margin:12px 0;
}

.order-item{
display:flex;
justify-content:space-between;
align-items:center;
background:#f5f7fb;
padding:14px;
margin:10px 0;
border-radius:8px;
}

.total{
text-align:right;
color:#1E3A8A;
margin-top:25px;
}

.thank-you{
text-align:center;
margin-top:35px;
font-size:18px;
font-weight:bold;
color:#1E3A8A;
}

.place-order-btn{
display:block;
margin:30px auto 0;
background:#16a34a;
color:white;
border:none;
padding:14px 35px;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:.3s;
box-shadow:0 4px 10px rgba(22,163,74,.3);
}

.place-order-btn:hover{
background:#15803d;
transform:translateY(-2px);
}

.place-order-btn:active{
transform:scale(.97);
}.modal{
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
justify-content:center;
align-items:center;
z-index:9999;
}

.success-content{
background:white;
width:380px;
padding:35px;
border-radius:15px;
text-align:center;
animation:popup .3s ease;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.success-icon{
width:80px;
height:80px;
margin:0 auto 20px;
background:#22c55e;
color:white;
font-size:42px;
font-weight:bold;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
}

.success-content h2{
color:#1E3A8A;
margin-bottom:15px;
}

.success-content p{
font-size:17px;
color:#555;
line-height:1.6;
margin-bottom:25px;
}

.ok-btn{
background:#22c55e;
color:white;
border:none;
padding:12px 35px;
font-size:17px;
font-weight:bold;
border-radius:8px;
cursor:pointer;
transition:.3s;
}

.ok-btn:hover{
background:#16a34a;
transform:translateY(-2px);
}

@keyframes popup{

from{
transform:scale(.8);
opacity:0;
}

to{
transform:scale(1);
opacity:1;
}

}

</style>

</head>
<body>

<a href="cart.html" class="back-btn">← Back to Cart</a>

<div class="checkout-container">

<h1>Pharmacy Invoice</h1>

<h2>Customer Details</h2>

<div class="customer-details">

<p><strong>Name:</strong> <span id="customerName"></span></p>

<p><strong>Phone:</strong> <span id="customerPhone"></span></p>

<p><strong>Address:</strong> <span id="customerAddress"></span></p>

</div>

<h2>Order Summary</h2>

<div id="checkoutItems"></div>

<h2 class="total">
Total: Rs. <span id="totalAmount">0</span>
</h2>

<p class="thank-you">
Thank you for your order!
</p>

<button id="placeOrderBtn" class="place-order-btn">
Place Order
</button>

</div>

<!-- Success Popup -->

<div class="modal" id="successModal">

<div class="modal-content success-content">

<div class="success-icon">
✔
</div>

<h2>Order Placed Successfully!</h2>

<p>
Thank you for shopping with us.<br>
Your order has been successfully placed.
</p>

<button id="okBtn" class="ok-btn">
OK
</button>

</div>

</div>

<script src="checkout.js"></script>

</body>

</html>
