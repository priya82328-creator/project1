<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pharmacy Invoice</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    background:#f4f8ff;
}

.checkout-container{
    width:600px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    color:#1E3A8A;
}

.checkout-container h2{
    color:#1E3A8A;
    border-bottom:2px solid #ddd;
    padding-bottom:10px;
}

.customer-details p{
    font-size:17px;
    margin:10px 0;
}

.order-item{
    display:flex;
    justify-content:space-between;
    background:#f5f7fb;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
}

.total{
    text-align:right;
    color:#1E3A8A;
    margin-top:20px;
}

.thank-you{
    text-align:center;
    margin-top:30px;
    font-size:18px;
    font-weight:600;
    color:#1E3A8A;
}

</style>

</head>

<body>

<nav>
<a href="home.html">Home</a>
<a href="search.html">Explore</a>
<a href="cart.html">Cart</a>
</nav>


<div class="checkout-container">

<h1>Pharmacy Invoice</h1>

<h2>Customer Details</h2>

<div class="customer-details">

<p>Name: <span id="customerName"></span></p>

<p>Phone: <span id="customerPhone"></span></p>

<p>Address: <span id="customerAddress"></span></p>

</div>


<h2>Order Summary</h2>

<div id="checkoutItems"></div>


<h2 class="total">
Total: Rs. <span id="totalAmount">0</span>
</h2>


<p class="thank-you">
Thank you for your order.
</p>


</div>


<script src="checkout.js"></script>

</body>

</html>
