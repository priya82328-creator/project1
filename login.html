<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Web System - Login</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        /* Toast Notification */
.toast {
    position: fixed;
    top: 20px;
    right: 20px;
    min-width: 280px;
    padding: 15px 20px;
    border-radius: 8px;
    background: #28a745;
    color: white;
    font-size: 15px;
    font-weight: 600;
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);

    opacity: 0;
    visibility: hidden;
    transform: translateX(120%);
    transition: all 0.4s ease;

    z-index: 9999;
}

.toast.show {
    opacity: 1;
    visibility: visible;
    transform: translateX(0);
}
    </style>
</head>

<body>

<nav>

    <a href="home.html">Home</a>

    <a href="search.html">Explore</a>

    <a href="login.html" id="loginLink">Login</a>

    <a href="cart.html" id="cartLink" style="display:none;">
        🛒 Cart (<span id="cartCount">0</span>)
    </a>

    <a href="contact.html">Contact Us</a>

    <a href="#" id="logoutLink" style="display:none;">
        Logout
    </a>

</nav>

<div class="login-container">

    <div class="login-box">

        <h1>Login</h1>

        <p class="subtitle">
            Sign in to continue
        </p>

        <form id="loginForm">

            <div class="input-group">

                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    required autocomplete="off">

            </div>

            <div class="input-group">

                <label>Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                    <i class="fa-solid fa-eye eye-icon"
                       id="togglePassword"></i>

                </div>

            </div>

            <div class="login-options">

                <label>

                    <input type="checkbox">

                    Remember Me

                </label>

                <a href="forgotpassword.html">
                    Forgot Password?
                </a>

            </div>

            <button
                type="submit"
                class="login-btn">

                Login

            </button>

        </form>

        <div class="signup-link">
            <p class="message" id="message"></p>
            Don't have an account?

            <a href="signup.html">
                Create Account
            </a>

        </div>
        <!-- Profile Section (Hidden Initially) -->

<div class="profile-box" id="profileBox" style="display:none;">

    <h2>
        👤 My Profile
    </h2>

    <p>
        Name:
        <span id="profileName"></span>
    </p>

    <p>
        Email:
        <span id="profileEmail"></span>
    </p>

    <p>
        Contact:
        <span id="profileContact"></span>
    </p>

    <button class="login-btn" onclick="logout()">
        Logout
    </button>

</div>

    </div>

</div>
<!-- Logout Toast Notification -->
<div id="toast" class="toast"></div>

<script src="login.js"></script>





</body>
</html>
